name: Private fixture witness opt-in

# Verification-only branch. Never merge/deploy this opt-in workflow.
# No uploads, resets, report starts, saves, renders or readable source artifacts.
# Retain run39648748468: its prepared build was superseded before any selection.
on:
  push:
    branches:
      - verify/private-fixture-witness-20261021
    paths:
      - .github/workflows/private-fixture-witness-opt-in.yml

permissions:
  contents: read

concurrency:
  group: monthly-isolated-live-production
  cancel-in-progress: false

jobs:
  readonly-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and metadata-receipt encryption
        run: |
          python -m pip install playwright==1.58.0 cryptography==46.0.4
          python -m playwright install --with-deps chromium
      - name: Validate synthetic encryption, exact build and native-identity controls
        run: |
          python -m py_compile scripts/qa_private_fixture_witness.py scripts/qa_private_fixture_observed.py
          python -m scripts.qa_private_fixture_witness --self-test
          python -m scripts.qa_private_fixture_observed --self-test
      - name: Observe served SHA then read approved unchanged original with exact bracketing
        run: |
          python -m scripts.qa_private_fixture_observed \
            scripts/private-fixture-public-config.json \
            45ecc27b7948423049404a70ed58d3f1155c6c2b
      - name: Retain only sealed metadata receipt and sealed failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sealed-fixture-witness-${{ github.run_id }}
          path: test-artifacts/private-fixture-witness/receipt.encrypted.json
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
