name: Monthly workflow compatible upgrade

on:
  pull_request:
    paths:
      - 'app/monthly_report_workflow_standards.py'
      - 'app/monthly_report_library.py'
      - 'app/monthly_report_sources.py'
      - 'scripts/qa_workflow_compatible_upgrade.py'
      - '.github/workflows/monthly-workflow-upgrade.yml'
  push:
    branches: [main]
    paths:
      - 'app/monthly_report_workflow_standards.py'
      - 'app/monthly_report_library.py'
      - 'app/monthly_report_sources.py'
      - 'scripts/qa_workflow_compatible_upgrade.py'
      - '.github/workflows/monthly-workflow-upgrade.yml'

permissions:
  contents: read

jobs:
  retained-state-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: a1b2aa61aa92c596d424c95dba29be66135f3441
          path: baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: candidate/requirements-dev.lock
      - name: Install locked application dependencies
        run: python -m pip install -r candidate/requirements-dev.lock
      - name: Write with baseline, upgrade in separate process, read retained history with baseline
        timeout-minutes: 4
        run: python candidate/scripts/qa_workflow_compatible_upgrade.py --baseline baseline --candidate candidate --output test-artifacts/workflow-upgrade/result.json
      - name: Preserve exact revision and first-attempt durability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-workflow-upgrade-${{ github.run_attempt }}
          path: test-artifacts/workflow-upgrade/
          retention-days: 7
          if-no-files-found: error
