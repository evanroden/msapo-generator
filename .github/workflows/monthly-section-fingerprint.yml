name: Monthly section fingerprint A31
on:
  pull_request:
    paths:
      - 'app/monthly_report_preview.py'
      - 'tests/test_monthly_report_section_fingerprint_cache.py'
      - '.github/workflows/monthly-section-fingerprint.yml'
  push:
    branches: [main]
    paths:
      - 'app/monthly_report_preview.py'
      - 'tests/test_monthly_report_section_fingerprint_cache.py'
      - '.github/workflows/monthly-section-fingerprint.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  synthetic-fingerprints:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked Python dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Twelve-section cold/warm performance and hash-preservation proofs
        env:
          EPC_DATA_DIR: ${{ runner.temp }}/a31-monthly-synthetic
        run: |
          python -m pytest -q -s tests/test_monthly_report_section_fingerprint_cache.py tests/test_monthly_report_section_assembly_cache.py
