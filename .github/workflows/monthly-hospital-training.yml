name: Publish hospital training correction
on:
  push:
    branches: [fix/monthly-report-hospital-training]
    paths: [.github/workflows/monthly-hospital-training.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify baseline and reviewed synthetic-code patch
        run: |
          git diff --exit-code 6f65108cb181310a27b60648f06e289e6c3189cd HEAD -- app tests docs
          echo '0801b9686b2632ef4c6fb2889d59a02355977deae66d2f9d2d82dcd1dd4fdf83  scripts/monthly-hospital-training.patch' | sha256sum --check
          git apply --check scripts/monthly-hospital-training.patch
          git apply --index scripts/monthly-hospital-training.patch
          git rm scripts/monthly-hospital-training.patch .github/workflows/monthly-hospital-training.yml
          python3 -m compileall -q app tests
          git diff --cached --check
          test "$(git write-tree)" = c9913498215a0d723e954c5dca3f02aadfae8000
      - name: Commit correction for normal PR validation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use hospital staff rather than provider contacts for monthly training'
          git push origin HEAD:fix/monthly-report-hospital-training
          git rev-parse HEAD
