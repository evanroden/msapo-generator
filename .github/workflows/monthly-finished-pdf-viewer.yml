name: Finished PDF browser
on:
  pull_request:
    paths:
      - '.github/workflows/monthly-finished-pdf-viewer.yml'
      - 'app/monthly_report_guided.py'
      - 'app/monthly_report_output_ui.py'
      - 'app/reference_preview.py'
      - 'app/monthly_report_preview_view.py'
      - 'app/monthly_report_preview_store.py'
      - 'scripts/qa_monthly_finished_pdf_viewer.py'
      - 'tests/fixtures/workspaces/finished_pdf_viewer_app.py'
      - 'requirements-dev.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-session-pdf-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked application and browser runtime
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
      - name: Native synthetic finished-PDF view, no-PDF replacement and reset
        run: python scripts/qa_monthly_finished_pdf_viewer.py
      - name: Retain full browser evidence including first failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finished-pdf-browser-evidence
          path: test-artifacts/finished-pdf-viewer/
          if-no-files-found: warn
