name: Focused release validation
on:
  push:
    branches: [validation/focused-release-20261110]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FONTCONFIG_FILE: ${{ github.workspace }}/runtime/fonts.conf
      ANTHROPIC_API_KEY: test-key-not-used
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5229fff763d8aad20158c94073fa859782af72eb
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies and renderers
        run: |
          sudo python3 scripts/ci_ubuntu_mirror_priority.py
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc fontconfig fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea fonts-texgyre fonts-opensymbol fonts-urw-base35
          python -m pip install -r requirements-dev.lock
      - name: Validate cover diagnostic repairs
        run: |
          git rev-parse HEAD
          python -m pytest -q tests/test_cover_complex_object_recovery.py tests/test_monthly_report_cover_art_recovery.py tests/test_monthly_report_cover_gallery_recovery.py tests/test_monthly_report_native_budget_notice_ui.py tests/test_monthly_report_novice_cover.py tests/test_monthly_report_starting_replacement_completion.py tests/test_monthly_report_starting_review_recovery.py --junitxml=focused-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-cover-results
          path: focused-results.xml
