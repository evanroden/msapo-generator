permissions:
  contents: read

concurrency:
  group: adaptive-dom-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-dom:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked app and browser harness
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc
          python -m pip install -r requirements-dev.lock
          python scripts/patch_streamlit_frontend.py
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
      - name: Pure geometry and real Streamlit DOM
        run: |
          node --test tests/workspace_geometry_test.cjs
          node --test tests/preview_view_lifecycle_test.cjs
          node --test tests/preview_commit_gate_test.cjs
          python scripts/qa_adaptive_workspaces.py
      - name: Actual Expense workflow with isolated synthetic inputs
        if: ${{ !cancelled() }}
        run: python scripts/qa_expense_adaptive.py
      - name: Actual Purchase order workflow with isolated synthetic inputs
        if: ${{ !cancelled() }}
        run: python scripts/qa_po_adaptive.py
      - name: Actual Monthly workflow with isolated synthetic inputs
        if: ${{ !cancelled() }}
        run: python scripts/qa_browser_diagnostics.py qa_monthly_adaptive.py
      - name: Fresh ordinary Monthly site pointer and keyboard from zero
        if: ${{ !cancelled() }}
        run: python scripts/qa_monthly_site_pointer.py
      - name: Prepared-by correction link reaches the native field by pointer and keyboard
        if: ${{ !cancelled() }}
        run: python scripts/qa_monthly_preparer_navigation.py
      - name: Native Training and issue text with real exports and deliberate clear/reentry
        if: ${{ !cancelled() }}
        run: python scripts/qa_monthly_text_hydration.py
      - name: Shared fixture upload and actual Starting report workflow
        if: ${{ !cancelled() }}
        run: python scripts/qa_browser_diagnostics.py qa_shared_fixture_testing.py
      - name: Water page management across desktop and narrow browser with actual output
        if: ${{ !cancelled() }}
        env:
          EPC_MONTHLY_WATER_TASK: '1'
        run: python scripts/qa_water_page_journey.py
      - name: Fresh ordinary Water page review from empty omitted state
        if: ${{ !cancelled() }}
        run: python scripts/qa_water_fresh_page_journey.py
      - name: Select explicitly requested one-shot native owner diagnostic
        id: native_owner_request
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.number == 249 && github.run_attempt == 1 }}
        run: python scripts/qa_fresh_native_owner_diagnostic.py --emit-gate
      - name: One separate diagnostic-only WebKit native observer owner capture
        if: ${{ !cancelled() && steps.native_owner_request.outputs.enabled == 'true' }}
        run: python scripts/qa_fresh_native_owner_diagnostic.py
      - name: Upload synthetic screenshots and geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-synthetic-browser-evidence
          path: |
            test-artifacts/adaptive-workspaces/
            test-artifacts/expense-adaptive/
            test-artifacts/po-adaptive/
            test-artifacts/monthly-adaptive/
            test-artifacts/monthly-first-site/
            test-artifacts/monthly-preparer-navigation/
            test-artifacts/monthly-text-hydration/
            test-artifacts/shared-fixture-testing/
            test-artifacts/water-page-journey/
            test-artifacts/water-fresh-page-journey/
          retention-days: 7
          if-no-files-found: warn
      - name: Upload separate native owner diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-native-owner-diagnostic-evidence
          path: test-artifacts/fresh-native-owner-diagnostic/
          retention-days: 7
          if-no-files-found: warn
