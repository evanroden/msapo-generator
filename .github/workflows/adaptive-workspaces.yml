permissions:
  contents: read

concurrency:
  group: adaptive-dom-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  literal-labels:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked app and literal-label browser harness
        timeout-minutes: 20
        run: |
          sudo python3 scripts/ci_ubuntu_mirror_priority.py
          python -m pip install -r requirements-dev.lock
          python scripts/patch_streamlit_frontend.py
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
      - name: Literal imported labels have no automatic links or formatting
        timeout-minutes: 11
        run: |
          python scripts/ci_native_test_budget.py --minutes 10 <<'NATIVE_TEST'
          python scripts/qa_monthly_literal_labels.py
          NATIVE_TEST
      - name: Upload literal-label evidence immediately, including first failures
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: monthly-literal-label-browser-evidence
          path: test-artifacts/monthly-literal-labels/
          retention-days: 7
          if-no-files-found: warn
  synthetic-progress-photos:
    runs-on: ubuntu-24.04
    # Package transfer time is not browser test time. Keep both separately
    # bounded, including the original 15-minute ceiling for the two tests.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked app and native Progress photos harness
        timeout-minutes: 20
        run: |
          sudo python3 scripts/ci_ubuntu_mirror_priority.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          python -m pip install -r requirements-dev.lock
          python scripts/patch_streamlit_frontend.py
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
      - name: Browser consent gates and actual Progress photos Word/PDF journey
        timeout-minutes: 15
        env:
          EPC_REQUIRE_PICTURE_BROWSER: '1'
        run: |
          set -e
          python -m pytest tests/test_picture_group_browser.py -q
          python scripts/qa_progress_photo_journey.py
      - name: Upload synthetic Progress photos evidence, including first failures
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: progress-photo-browser-evidence
          path: test-artifacts/progress-photo-journey/
          retention-days: 7
          if-no-files-found: warn
  synthetic-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked app and history browser harness
        timeout-minutes: 20
        run: |
          sudo python3 scripts/ci_ubuntu_mirror_priority.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          python -m pip install -r requirements-dev.lock
          python scripts/patch_streamlit_frontend.py
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
      - name: Actual isolated shared-history saves and read-only inspection
        timeout-minutes: 16
        run: |
          python scripts/ci_native_test_budget.py --minutes 15 <<'NATIVE_TEST'
          python scripts/qa_monthly_history.py
          NATIVE_TEST
      - name: Upload synthetic history evidence, including first failures
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: monthly-history-browser-evidence
          path: test-artifacts/monthly-history/
          retention-days: 7
          if-no-files-found: warn
  synthetic-dom:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked app and browser harness
        timeout-minutes: 20
        run: |
          sudo python3 scripts/ci_ubuntu_mirror_priority.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc
          python -m pip install -r requirements-dev.lock
          python scripts/patch_streamlit_frontend.py
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
      - name: Apply exact locked scalar date compatibility repair
        timeout-minutes: 26
        run: |
          python scripts/ci_native_test_budget.py --minutes 25 <<'NATIVE_TEST'
          python scripts/patch_streamlit_date_input.py
          NATIVE_TEST
      - name: Pure geometry and real Streamlit DOM
        timeout-minutes: 26
        run: |
          python scripts/ci_native_test_budget.py --minutes 25 <<'NATIVE_TEST'
          node --test tests/workspace_geometry_test.cjs
          node --test tests/preview_view_lifecycle_test.cjs
          node --test tests/preview_commit_gate_test.cjs
          python scripts/qa_adaptive_workspaces.py
          NATIVE_TEST
      - name: Native sidebar visibility and pointer/keyboard navigation
        if: ${{ !cancelled() }}
        timeout-minutes: 26
        run: |
          python scripts/ci_native_test_budget.py --minutes 25 <<'NATIVE_TEST'
          python scripts/qa_sidebar_navigation.py
          NATIVE_TEST
      - name: Upload native sidebar evidence immediately, including first failures
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: native-sidebar-browser-evidence-${{ github.run_attempt }}
          path: test-artifacts/sidebar-navigation/
          retention-days: 7
          if-no-files-found: warn
      - name: Actual Expense workflow with isolated synthetic inputs
        if: ${{ !cancelled() }}
        timeout-minutes: 26
        run: |
          python scripts/ci_native_test_budget.py --minutes 25 <<'NATIVE_TEST'
          python scripts/qa_expense_adaptive.py
          NATIVE_TEST
      - name: Actual Purchase order workflow with isolated synthetic inputs
        if: ${{ !cancelled() }}
        timeout-minutes: 26
        run: |
          python scripts/ci_native_test_budget.py --minutes 25 <<'NATIVE_TEST'
          python scripts/qa_po_adaptive.py
          NATIVE_TEST
      - name: Actual Monthly workflow with isolated synthetic inputs
        if: ${{ !cancelled() }}
        timeout-minutes: 26
        run: |
          python scripts/ci_native_test_budget.py --minutes 25 <<'NATIVE_TEST'
          python scripts/qa_browser_diagnostics.py qa_monthly_adaptive.py
          NATIVE_TEST
      - name: Source correction links reach native controls and persist after reload
        if: ${{ !cancelled() }}
        timeout-minutes: 26
        run: |
          python scripts/ci_native_test_budget.py --minutes 25 <<'NATIVE_TEST'
          python scripts/qa_source_corrections.py
          NATIVE_TEST
      - name: Upload source correction evidence immediately, including first failures
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: source-correction-browser-evidence-${{ github.run_attempt }}
          path: test-artifacts/source-corrections/
          retention-days: 7
          if-no-files-found: warn
      - name: Fresh ordinary Monthly site pointer and keyboard from zero
        if: ${{ !cancelled() }}
        timeout-minutes: 26
        run: |
          python scripts/ci_native_test_budget.py --minutes 25 <<'NATIVE_TEST'
          python scripts/qa_monthly_site_pointer.py
          NATIVE_TEST
      - name: Prepared-by correction link reaches the native field by pointer and keyboard
        if: ${{ !cancelled() }}
        timeout-minutes: 26
        run: |
          python scripts/ci_native_test_budget.py --minutes 25 <<'NATIVE_TEST'
          python scripts/qa_monthly_preparer_navigation.py
          NATIVE_TEST
      - name: Native Training and issue text with real exports and deliberate clear/reentry
        if: ${{ !cancelled() }}
        timeout-minutes: 26
        run: |
          python scripts/ci_native_test_budget.py --minutes 25 <<'NATIVE_TEST'
          python scripts/qa_monthly_text_hydration.py
          NATIVE_TEST
      - name: Shared fixture upload and actual Starting report workflow
        if: ${{ !cancelled() }}
        timeout-minutes: 26
        run: |
          python scripts/ci_native_test_budget.py --minutes 25 <<'NATIVE_TEST'
          python scripts/qa_browser_diagnostics.py qa_shared_fixture_testing.py
          NATIVE_TEST
      - name: Shared logo single-record replacement, stale review and restore
        if: ${{ !cancelled() }}
        timeout-minutes: 26
        run: |
          python scripts/ci_native_test_budget.py --minutes 25 <<'NATIVE_TEST'
          python scripts/qa_single_logo_admin.py
          NATIVE_TEST
      - name: Upload shared-logo evidence immediately, including first failures
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: shared-logo-browser-evidence-${{ github.run_attempt }}
          path: test-artifacts/single-logo-admin/
          retention-days: 7
          if-no-files-found: warn
      - name: Optional About company-logo refresh and durable native outputs
        if: ${{ !cancelled() }}
        timeout-minutes: 26
        run: |
          python scripts/ci_native_test_budget.py --minutes 25 <<'NATIVE_TEST'
          python scripts/qa_about_logo_refresh.py
          NATIVE_TEST
      - name: Upload About-logo evidence immediately, including first failures
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: about-logo-browser-evidence-${{ github.run_attempt }}
          path: test-artifacts/about-logo-refresh/
          retention-days: 7
          if-no-files-found: warn
      - name: Water page management across desktop and narrow browser with actual output
        if: ${{ !cancelled() }}
        env:
          EPC_MONTHLY_WATER_TASK: '1'
        timeout-minutes: 26
        run: |
          python scripts/ci_native_test_budget.py --minutes 25 <<'NATIVE_TEST'
          python scripts/qa_water_page_journey.py
          NATIVE_TEST
      - name: Native proposal and onsite row editing with actual output
        if: ${{ !cancelled() }}
        env:
          EPC_MONTHLY_ROW_TASK: '1'
        timeout-minutes: 26
        run: |
          python scripts/ci_native_test_budget.py --minutes 25 <<'NATIVE_TEST'
          python scripts/qa_report_row_cards.py
          NATIVE_TEST
      - name: Compact contact native lifecycle, shared recovery and actual outputs
        if: ${{ !cancelled() }}
        timeout-minutes: 26
        run: |
          python scripts/ci_native_test_budget.py --minutes 25 <<'NATIVE_TEST'
          python scripts/qa_compact_contact_journey.py
          NATIVE_TEST
      - name: Fresh ordinary Water page review from empty omitted state
        if: ${{ !cancelled() }}
        timeout-minutes: 26
        run: |
          python scripts/ci_native_test_budget.py --minutes 25 <<'NATIVE_TEST'
          python scripts/qa_water_fresh_page_journey.py
          NATIVE_TEST
      - name: Select explicitly requested one-shot native owner diagnostic
        id: native_owner_request
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.number == 249 && github.run_attempt == 1 }}
        timeout-minutes: 26
        run: |
          python scripts/ci_native_test_budget.py --minutes 25 <<'NATIVE_TEST'
          python scripts/qa_fresh_native_owner_diagnostic.py --emit-gate
          NATIVE_TEST
      - name: One separate diagnostic-only WebKit native observer owner capture
        if: ${{ !cancelled() && steps.native_owner_request.outputs.enabled == 'true' }}
        timeout-minutes: 26
        run: |
          python scripts/ci_native_test_budget.py --minutes 25 <<'NATIVE_TEST'
          python scripts/qa_fresh_native_owner_diagnostic.py
          NATIVE_TEST
      - name: Upload synthetic screenshots and geometry
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-synthetic-browser-evidence
          path: |
            test-artifacts/adaptive-workspaces/
            test-artifacts/sidebar-navigation/
            test-artifacts/expense-adaptive/
            test-artifacts/po-adaptive/
            test-artifacts/monthly-adaptive/
            test-artifacts/source-corrections/
            test-artifacts/monthly-first-site/
            test-artifacts/monthly-preparer-navigation/
            test-artifacts/monthly-text-hydration/
            test-artifacts/shared-fixture-testing/
            test-artifacts/single-logo-admin/
            test-artifacts/about-logo-refresh/
            test-artifacts/water-page-journey/
            test-artifacts/report-row-cards/
            test-artifacts/compact-contact-journey/
            test-artifacts/water-fresh-page-journey/
          retention-days: 7
          if-no-files-found: warn
      - name: Upload separate native owner diagnostic evidence
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: fresh-native-owner-diagnostic-evidence
          path: test-artifacts/fresh-native-owner-diagnostic/
          retention-days: 7
          if-no-files-found: warn

  training-date:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked app and browser harness
        timeout-minutes: 20
        run: |
          sudo python3 scripts/ci_ubuntu_mirror_priority.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc
          python -m pip install -r requirements-dev.lock
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
      - name: Native Training single date baseline, repair, session add/remove and actual output
        timeout-minutes: 16
        run: |
          python scripts/ci_native_test_budget.py --minutes 15 <<'NATIVE_TEST'
          python scripts/qa_monthly_training_date.py
          NATIVE_TEST
      - name: Upload synthetic Training date evidence
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: training-date-synthetic-browser-evidence
          path: test-artifacts/monthly-training-date/
          retention-days: 7
          if-no-files-found: warn
