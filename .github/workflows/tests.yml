name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Avoid duplicating full browser and renderer work for superseded PR heads.
# Every new PR revision still starts all applicable required checks.
# Main pushes retain the active run and replace pending runs; dispatch uses unique run IDs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-24.04
    # Pull requests run only the tests affected by the PR; pushes to main
    # always run the complete suite here. scripts/ci_select_tests.py picks
    # the affected files (direct importers of changed modules, tests that
    # mention them, changed test files) and falls back to the full suite
    # whenever the change touches shared code, fixtures, workflows,
    # entrypoints, or anything it cannot map -- and a selection that would
    # still cover most of the suite runs everything instead. The full suite
    # on main is the backstop for a knock-on regression a PR selection
    # misses; that residual risk is the price of the faster PR runs.
    # Timeouts still fail CI and block release.
    timeout-minutes: 180
    env:
      FONTCONFIG_FILE: ${{ github.workspace }}/runtime/fonts.conf
    steps:
      - uses: actions/checkout@v4
        with:
          # The selector diffs the PR head against its base, so it needs
          # the full history rather than the default shallow checkout.
          fetch-depth: 0
      # The runner image ships no LibreOffice, so every test that renders a
      # document silently SKIPPED here and the paths went unverified: the
      # expense combined-PDF has been skipping since it was written, and the
      # purchase-order flow now depends on Writer too (it renders the MSAPO
      # form). Install the same renderers and fonts the Dockerfile does, so CI
      # exercises what production actually runs instead of quietly stepping
      # over it.
      - name: Install document renderers
        timeout-minutes: 20
        run: |
          sudo python3 scripts/ci_ubuntu_mirror_priority.py
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer \
            libreoffice-calc \
            fontconfig \
            fonts-dejavu-core \
            fonts-dejavu-extra \
            fonts-liberation \
            fonts-crosextra-carlito \
            fonts-crosextra-caladea \
            fonts-texgyre \
            fonts-opensymbol \
            fonts-urw-base35
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Validate environment and Python sources
        run: |
          python -m pip check
          python runtime/check_renderer.py
          python -m compileall -q app pages scripts run_web.py
      - name: Select tests for this event
        run: python scripts/ci_select_tests.py --event "${{ github.event_name }}" --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha || github.sha }}" --out selected-tests.txt
      - name: Run tests
        env:
          ANTHROPIC_API_KEY: test-key-not-used
          INDEPENDENT_OUTPUT: ${{ github.workspace }}/test-artifacts/independent-synthetic
          MSAPO_SHA: ${{ github.sha }}
        run: python -m pytest -q --junitxml=test-results.xml $(cat selected-tests.txt)
      - name: Retain independent synthetic output, including first failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-synthetic-output
          path: test-artifacts/independent-synthetic/
          if-no-files-found: warn
          retention-days: 7
      - name: Export real synthetic Word/PDF for acceptance
        run: python -m scripts.qa_monthly_report_outputs
      - name: Upload synthetic Word/PDF with page and hash manifest
        uses: actions/upload-artifact@v4
        with:
          name: monthly-synthetic-docx-pdf
          path: test-artifacts/monthly-synthetic/
          if-no-files-found: error
          retention-days: 7
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results.xml
          if-no-files-found: error
          retention-days: 7

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Hosts other than Render stamp the served commit at build time (About
      # shows it); build the way they do and check the image reports it.
      - name: Build production image
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: docker build --build-arg APP_GIT_COMMIT="$COMMIT" --tag msapo-render-check .
      - name: Verify the image reports its commit and passes the host check
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          served="$(docker run --rm msapo-render-check python -c 'from app.public_build import runtime_commit; print(runtime_commit())')"
          test "$served" = "$COMMIT" || { echo "image reports '$served', built from $COMMIT"; exit 1; }
          docker run --rm --env EPC_DATA_DIR=/tmp/host-check-data \
            --env ANTHROPIC_API_KEY=test-key-not-used \
            --env SMARTSHEET_FORM_URL=https://example.invalid/form \
            --env EXPENSE_ACCOUNT_DIRECTORS_JSON='{}' \
            msapo-render-check sh -c 'mkdir -p /tmp/host-check-data && python scripts/host_check.py --offline'
      - name: Verify production app starts and becomes healthy
        run: |
          docker run --detach --name msapo-render-check --env ANTHROPIC_API_KEY=test-key-not-used msapo-render-check
          for attempt in $(seq 1 36); do
            state=$(docker inspect --format='{{.State.Health.Status}}' msapo-render-check)
            if [ "$state" = healthy ]; then exit 0; fi
            if [ "$state" = unhealthy ]; then break; fi
            sleep 5
          done
          docker logs msapo-render-check
          exit 1
      - name: Remove smoke-test container
        if: always()
        run: docker rm --force msapo-render-check || true

  monthly-report-resources:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build production image for capped resource test
        run: docker build --tag msapo-resource-check .
      - name: Exercise two preview visitors and final export at Starter limits
        run: |
          docker run --name msapo-resource-check --memory=512m --memory-swap=512m --cpus=0.5 \
            --env RESOURCE_REQUIRE_512_MB=1 --env ANTHROPIC_API_KEY=test-key-not-used \
            --entrypoint python msapo-resource-check scripts/qa_monthly_report_resources.py
          test "$(docker inspect --format='{{.State.OOMKilled}}' msapo-resource-check)" = false
      - name: Copy verified synthetic native Word/PDF evidence from capped container
        if: success()
        run: |
          mkdir -p test-artifacts/monthly-native-master
          docker cp msapo-resource-check:/tmp/monthly-synthetic-native-evidence/. test-artifacts/monthly-native-master/
      - name: Upload synthetic ten-table Word/PDF evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-native-ten-table-docx-pdf
          path: test-artifacts/monthly-native-master/
          if-no-files-found: error
          retention-days: 7
      - name: Remove synthetic resource container
        if: always()
        run: docker rm --force msapo-resource-check || true
