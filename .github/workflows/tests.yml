name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    # Renderer packages can exceed the old entire-job budget on a slow mirror.
    # Keep the full rendering suite mandatory after installation completes.
    timeout-minutes: 45
    env:
      FONTCONFIG_FILE: ${{ github.workspace }}/runtime/fonts.conf
    steps:
      - uses: actions/checkout@v4
      # The runner image ships no LibreOffice, so every test that renders a
      # document silently SKIPPED here and the paths went unverified: the
      # expense combined-PDF has been skipping since it was written, and the
      # purchase-order flow now depends on Writer too (it renders the MSAPO
      # form). Install the same renderers and fonts the Dockerfile does, so CI
      # exercises what production actually runs instead of quietly stepping
      # over it.
      - name: Install document renderers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer \
            libreoffice-calc \
            fontconfig \
            fonts-dejavu-core \
            fonts-dejavu-extra \
            fonts-liberation \
            fonts-crosextra-carlito \
            fonts-crosextra-caladea \
            fonts-texgyre \
            fonts-opensymbol \
            fonts-urw-base35
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Validate environment and Python sources
        run: |
          python -m pip check
          python runtime/check_renderer.py
          python -m compileall -q app pages scripts run_web.py
      - name: Run tests
        env:
          ANTHROPIC_API_KEY: test-key-not-used
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results.xml
          if-no-files-found: error
          retention-days: 7

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag msapo-render-check .
      - name: Verify production app starts and becomes healthy
        run: |
          docker run --detach --name msapo-render-check --env ANTHROPIC_API_KEY=test-key-not-used msapo-render-check
          for attempt in $(seq 1 36); do
            state=$(docker inspect --format='{{.State.Health.Status}}' msapo-render-check)
            if [ "$state" = healthy ]; then exit 0; fi
            if [ "$state" = unhealthy ]; then break; fi
            sleep 5
          done
          docker logs msapo-render-check
          exit 1
      - name: Remove smoke-test container
        if: always()
        run: docker rm --force msapo-render-check || true
