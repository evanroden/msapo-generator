name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # The runner image ships no LibreOffice, so every test that renders a
      # document silently SKIPPED here and the paths went unverified: the
      # expense combined-PDF has been skipping since it was written, and the
      # purchase-order flow now depends on Writer too (it renders the MSAPO
      # form). Install the same renderers and fonts the Dockerfile does, so CI
      # exercises what production actually runs instead of quietly stepping
      # over it.
      - name: Install document renderers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer \
            libreoffice-calc \
            fonts-dejavu-core \
            fonts-dejavu-extra \
            fonts-liberation \
            fonts-urw-base35
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        env:
          ANTHROPIC_API_KEY: test-key-not-used
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results.xml
          if-no-files-found: error
          retention-days: 7
