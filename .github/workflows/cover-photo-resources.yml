name: Cover photograph resources

on:
  pull_request:
    paths:
      - 'app/monthly_report_cover*.py'
      - 'app/monthly_report_docx.py'
      - 'app/monthly_report_section_ui.py'
      - 'app/monthly_report_render_jobs.py'
      - 'app/monthly_report_upload_limits.py'
      - 'app/ocr.py'
      - 'scripts/qa_cover_photo_resources.py'
      - 'scripts/qa_cover_recovery_resources.py'
      - 'scripts/qa_cover_recovery_service.py'
      - 'scripts/workspace_cover_service_observations.py'
      - 'tests/fixtures/workspaces/monthly_app.py'
      - 'scripts/cover_image_worker.py'
      - 'tests/test_cover_recovery*.py'
      - 'app/monthly_report_model.py'
      - 'app/monthly_report_library.py'
      - 'app/monthly_report_active_work.py'
      - 'app/monthly_report_guided.py'
      - 'app/monthly_report_setup.py'
      - 'tests/test_cover_photo_size_limits.py'
      - 'Dockerfile'
      - 'requirements*.txt'
      - 'requirements*.lock'
      - '.github/workflows/cover-photo-resources.yml'
  push:
    branches: [main]
    paths:
      - 'app/monthly_report_cover*.py'
      - 'app/monthly_report_docx.py'
      - 'app/monthly_report_section_ui.py'
      - 'app/monthly_report_render_jobs.py'
      - 'app/monthly_report_upload_limits.py'
      - 'app/ocr.py'
      - 'scripts/qa_cover_photo_resources.py'
      - 'scripts/qa_cover_recovery_resources.py'
      - 'scripts/qa_cover_recovery_service.py'
      - 'scripts/workspace_cover_service_observations.py'
      - 'tests/fixtures/workspaces/monthly_app.py'
      - 'scripts/cover_image_worker.py'
      - 'tests/test_cover_recovery*.py'
      - 'app/monthly_report_model.py'
      - 'app/monthly_report_library.py'
      - 'app/monthly_report_active_work.py'
      - 'app/monthly_report_guided.py'
      - 'app/monthly_report_setup.py'
      - 'tests/test_cover_photo_size_limits.py'
      - 'Dockerfile'
      - 'requirements*.txt'
      - 'requirements*.lock'
      - '.github/workflows/cover-photo-resources.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cover-photo-resources:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build complete production image
        run: docker build --tag msapo-cover-resource-check .
      - name: Generate bounded synthetic codec fixtures outside the measured process
        run: |
          mkdir -p test-artifacts/cover-fixtures test-artifacts/cover-resources
          timeout 180 docker run --name msapo-cover-generator \
            --memory=1536m --memory-swap=1536m --cpus=2 \
            --mount type=tmpfs,destination=/tmp,tmpfs-size=268435456 \
            --volume "$PWD/test-artifacts/cover-fixtures:/fixtures" \
            --entrypoint python msapo-cover-resource-check \
            scripts/qa_cover_photo_resources.py --generate /fixtures
          test "$(docker inspect --format='{{.State.OOMKilled}}' msapo-cover-generator)" = false
          test "$(du -sb test-artifacts/cover-fixtures | cut -f1)" -lt 470810624
      - name: Exercise encoded limits, retained visitors, decoder refusals and report-slot retry
        shell: bash
        run: |
          set -euo pipefail
          run_case() {
            name="$1"; file="$2"; visitors="$3"; expected="$4"; shift 4
            set +e
            timeout 180 docker run --name "msapo-cover-$name" \
              --memory=512m --memory-swap=512m --cpus=0.5 \
              --env RESOURCE_REQUIRE_512_MB=1 --env ANTHROPIC_API_KEY=test-key-not-used \
              --volume "$PWD/test-artifacts/cover-fixtures:/fixtures:ro" \
              --entrypoint python msapo-cover-resource-check scripts/qa_cover_photo_resources.py \
              --probe "/fixtures/$file" --concurrent "$visitors" --expect "$expected" "$@" \
              2>&1 | tee "test-artifacts/cover-resources/$name.log"
            status=${PIPESTATUS[0]}
            set -e
            test "$(docker inspect --format='{{.State.OOMKilled}}' "msapo-cover-$name")" = false
            test "$status" -eq 0
          }
          run_case png-one large.png 1 success
          run_case png-two large.png 2 safe
          run_case jpeg-one large.jpg 1 success
          run_case jpeg-two large.jpg 2 success
          run_case webp-one large.webp 1 memory
          run_case webp-two large.webp 2 memory
          run_case heif-one large.heic 1 memory
          run_case heif-two large.heic 2 memory
          run_case progressive-444-one progressive-444.jpg 1 memory
          run_case progressive-444-two progressive-444.jpg 2 memory
          run_case progressive-420-one progressive-420.jpg 1 memory
          run_case progressive-420-two progressive-420.jpg 2 memory
          run_case progressive-gray-one progressive-gray.jpg 1 success
          run_case progressive-gray-two progressive-gray.jpg 2 memory
          run_case report-slot-retry large.jpg 2 success --slot-retry
      - name: Exercise isolated automatic recovery with retained uploads in the real cgroup
        shell: bash
        run: |
          set -euo pipefail
          recover_case() {
            name="$1"; shift
            set +e
            timeout 90 docker run --name "msapo-cover-recovery-$name" \
              --memory=512m --memory-swap=512m --cpus=0.5 \
              --env RESOURCE_REQUIRE_512_MB=1 --env ANTHROPIC_API_KEY=test-key-not-used \
              --volume "$PWD/test-artifacts/cover-fixtures:/fixtures:ro" \
              --entrypoint python msapo-cover-resource-check scripts/qa_cover_recovery_resources.py "$@" \
              2>&1 | tee "test-artifacts/cover-resources/recovery-$name.log"
            status=${PIPESTATUS[0]}
            set -e
            test "$(docker inspect --format='{{.State.OOMKilled}}' "msapo-cover-recovery-$name")" = false
            test "$status" -eq 0
          }
          recover_case small --expect success
          recover_case alpha --kind alpha --expect success
          recover_case isolated --kind isolated --expect success
          recover_case corrupt --kind corrupt
          recover_case timeout --kind timeout
          recover_case slot --kind slot
          recover_case small-two --visitors 2 --expect success
          recover_case png-two --source /fixtures/large.png --visitors 2
          recover_case jpeg-two --source /fixtures/large.jpg --visitors 2
          recover_case progressive-two --source /fixtures/progressive-444.jpg --visitors 2
          recover_case webp-two --source /fixtures/large.webp --visitors 2
          recover_case heif-two --source /fixtures/large.heic --visitors 2
      - name: Retain measurements and refusal evidence (no source images)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cover-photograph-resource-measurements
          path: test-artifacts/cover-resources/
          if-no-files-found: warn
          retention-days: 7
      - name: Remove probe containers
        if: always()
        run: |
          docker ps --all --quiet --filter 'name=msapo-cover-' | xargs -r docker rm --force

  cover-recovery-running-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install host browser outside measured service
        timeout-minutes: 15
        run: |
          sudo python3 scripts/ci_ubuntu_mirror_priority.py
          python -m pip install -r requirements-dev.lock
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Build production dependency image
        run: docker build --tag msapo-cover-service-check .
      - name: Prepare only invented codec files outside service budget
        run: |
          mkdir -p test-artifacts/cover-service-fixtures test-artifacts/cover-service-data test-artifacts/cover-service
          printf synthetic-monthly-dom-v1 > test-artifacts/cover-service-data/monthly-dom-synthetic-only.marker
          timeout 180 docker run --name msapo-cover-service-generator \
            --memory=1536m --memory-swap=1536m --cpus=2 \
            --volume "$PWD/test-artifacts/cover-service-fixtures:/fixtures" \
            --entrypoint python msapo-cover-service-check \
            scripts/qa_cover_photo_resources.py --generate /fixtures
          test "$(docker inspect --format='{{.State.OOMKilled}}' msapo-cover-service-generator)" = false
      - name: Run actual marked Streamlit service at 512 MiB and half a CPU
        run: |
          docker run --detach --name msapo-cover-service \
            --memory=512m --memory-swap=512m --cpus=0.5 \
            --publish 127.0.0.1:8556:8501 \
            --env EPC_DATA_DIR=/qa-data --env EPC_MONTHLY_DOM_FIXTURE=1 \
            --env EPC_MONTHLY_COVER_SERVICE_TASK=1 --env ANTHROPIC_API_KEY=test-key-not-used \
            --volume "$PWD/test-artifacts/cover-service-data:/qa-data" \
            --volume "$PWD/tests/fixtures/workspaces:/app/tests/fixtures/workspaces:ro" \
            msapo-cover-service-check streamlit run tests/fixtures/workspaces/monthly_app.py \
            --server.address=0.0.0.0 --server.port=8501 --server.headless=true \
            --browser.gatherUsageStats=false
          timeout 120 bash -c 'until curl --fail --silent http://127.0.0.1:8556/_stcore/health; do sleep 2; done'
      - name: Native two-visitor upload, automatic preparation, explicit Use, recovery and real output
        timeout-minutes: 12
        run: |
          timeout 660 python scripts/qa_cover_recovery_service.py \
            --container msapo-cover-service --url http://127.0.0.1:8556 \
            --fixtures test-artifacts/cover-service-fixtures \
            --output test-artifacts/cover-service
      - name: Retain final service diagnostics
        if: always()
        run: |
          docker logs msapo-cover-service > test-artifacts/cover-service/server.log 2>&1 || true
          docker inspect msapo-cover-service > test-artifacts/cover-service/container.json || true
      - name: Upload measurements and synthetic output only (no originals)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cover-recovery-running-service
          path: test-artifacts/cover-service/
          if-no-files-found: warn
          retention-days: 7
      - name: Remove synthetic service and generator
        if: always()
        run: docker rm --force msapo-cover-service msapo-cover-service-generator || true
