name: Shared Archive Redeploy Read-only

# Explicit opt-in only. No uploads, source bytes, scheduled actions or service changes.
on:
  workflow_dispatch:
    inputs:
      archive_kind:
        description: Which existing shared Render archive shelf?
        type: choice
        required: true
        options: [originals, synthetic]
      bundle_prefix:
        description: Displayed 12-hex archive prefix or full 32-hex ID
        type: string
        required: true
      archive_sha256:
        description: Independently recorded full 64-hex archive SHA-256
        type: string
        required: true
      archive_size:
        description: Independently recorded exact archive byte count
        type: string
        required: true
      expected_commit:
        description: Full 40-hex commit expected to be SERVED by Render
        type: string
        required: true
      phase:
        description: Before or after an observed distinct served Render revision
        type: choice
        required: true
        options: [before, after]

permissions:
  contents: read

concurrency:
  group: shared-archive-readonly-${{ inputs.archive_kind }}-${{ inputs.bundle_prefix }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded browser verifier only
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Hash-check one already uploaded archive on exact served commit
        env:
          ARCHIVE_KIND: ${{ inputs.archive_kind }}
          BUNDLE_PREFIX: ${{ inputs.bundle_prefix }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          ARCHIVE_SIZE: ${{ inputs.archive_size }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          python -m scripts.qa_render_archive_redeploy_readonly verify \
            --archive-kind "$ARCHIVE_KIND" \
            --bundle-prefix "$BUNDLE_PREFIX" \
            --archive-sha256 "$ARCHIVE_SHA256" \
            --archive-size "$ARCHIVE_SIZE" \
            --expected-commit "$EXPECTED_COMMIT" \
            --phase "$PHASE" \
            --output "test-artifacts/shared-archive-redeploy/$PHASE.json"
      - name: Upload hash-only evidence; never the downloaded DOCX/PDF/ZIP bytes
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shared-archive-readonly-${{ inputs.archive_kind }}-${{ inputs.phase }}-${{ inputs.bundle_prefix }}
          path: test-artifacts/shared-archive-redeploy/*.json
          if-no-files-found: error
          retention-days: 30
