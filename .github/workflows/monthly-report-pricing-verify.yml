name: Monthly report pricing baseline

on:
  workflow_dispatch:
  push:
    branches: [fix/monthly-report-pricing-accuracy]
    paths: [.github/workflows/monthly-report-pricing-verify.yml]

# Coalesce superseded queued runs, as required by test_ci_workflow_concurrency.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Archive only the public source baseline
        run: git archive --format=tar.gz f517d39f519c8161359050088401acea0b1707d4 > "$RUNNER_TEMP/pricing-baseline.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: pricing-baseline-source
          path: ${{ runner.temp }}/pricing-baseline.tar.gz
          retention-days: 1
