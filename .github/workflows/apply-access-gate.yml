name: Apply access gate

on:
  push:
    branches:
      - agent/add-access-gate
    paths:
      - scripts/apply_access_gate.py
      - .github/workflows/apply-access-gate.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip access patch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-access-gate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply deterministic patch
        run: python scripts/apply_access_gate.py
      - name: Compile application
        run: python -m compileall -q app
      - name: Install and run tests
        env:
          ANTHROPIC_API_KEY: test-key-not-used
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Require configured access password [skip access patch]"
          git push origin HEAD:agent/add-access-gate
