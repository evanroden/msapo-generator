name: A62 Review direct visibility

on:
  pull_request:
    paths:
      - 'app/monthly_report_review_preview_ui.py'
      - 'app/monthly_report_review_activation.py'
      - 'tests/test_monthly_review_a62_direct_activation.py'
      - 'tests/test_monthly_report_review_direct_preview.py'
      - 'tests/fixtures/workspaces/monthly_a62_review_app.py'
      - 'scripts/qa_monthly_a62_review_browser.py'
      - '.github/workflows/monthly-review-direct.yml'
  push:
    branches: [main]
    paths:
      - 'app/monthly_report_review_preview_ui.py'
      - 'app/monthly_report_review_activation.py'
      - 'tests/test_monthly_review_a62_direct_activation.py'
      - 'tests/test_monthly_report_review_direct_preview.py'
      - 'tests/fixtures/workspaces/monthly_a62_review_app.py'
      - 'scripts/qa_monthly_a62_review_browser.py'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

concurrency:
  group: monthly-a62-direct-review
  cancel-in-progress: true

jobs:
  synthetic-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install exact app/browser harness
        timeout-minutes: 20
        run: |
          sudo python3 scripts/ci_ubuntu_mirror_priority.py
          python -m pip install -r requirements-dev.lock playwright==1.58.0
          python scripts/patch_streamlit_frontend.py
          python scripts/patch_streamlit_date_input.py
          python -m playwright install --with-deps chromium
      - name: Direct Review, stale refresh, isolation and lifecycle AppTests
        timeout-minutes: 6
        run: |
          python -m pytest -q \
            tests/test_monthly_report_review_direct_preview.py \
            tests/test_monthly_review_a62_direct_activation.py \
            tests/test_monthly_report_review_preview_lifecycle.py
      - name: Native-browser first viewport, accepted edit, stale retry
        timeout-minutes: 8
        run: python scripts/qa_monthly_a62_review_browser.py
      - name: Retain synthetic browser timing and first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a62-direct-review-evidence
          path: test-artifacts/monthly-a62-review/
          if-no-files-found: warn
          retention-days: 14
