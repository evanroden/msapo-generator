name: Verify native-page reflow

on:
  push:
    branches: [fix/monthly-report-master-tables]
    paths: [.github/workflows/monthly-report-apply-reflow.yml]

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FONTCONFIG_FILE: ${{ github.workspace }}/runtime/fonts.conf
      ANTHROPIC_API_KEY: test-key-not-used
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use isolated runner storage
        run: echo "EPC_DATA_DIR=$RUNNER_TEMP/monthly-report-tests" >> "$GITHUB_ENV"
      - name: Confirm existing application still matches the tested baseline
        run: git diff --exit-code 59293a785a198ac017f0025b88ce8c5280a1bee4 HEAD -- app/monthly_report_import.py app/monthly_report_native_layout.py docs/README.md
      - name: Install production renderers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc fontconfig fonts-dejavu-core fonts-dejavu-extra fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea fonts-texgyre fonts-opensymbol fonts-urw-base35
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install locked dependencies and validate renderer
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip check
          python runtime/check_renderer.py
      - name: Record expected regression failures before the fix
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, xml.etree.ElementTree as ET
          report = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reflow-before.xml'
          result = subprocess.run(['python', '-m', 'pytest', '-q', 'tests/test_monthly_report_native_reflow.py', '--junitxml=' + str(report)])
          suites = list(ET.parse(report).getroot().iter('testsuite'))
          if result.returncode != 1 or sum(int(s.get('errors', 0)) for s in suites) or not sum(int(s.get('failures', 0)) for s in suites):
              raise SystemExit('Expected assertion failures on the unchanged baseline, not a collection or environment failure.')
          PY
      - name: Apply the reviewed plain-text patch
        run: |
          echo 'ab2cf7ba63ac1823345b3e9c65e506989423a08f32cd74d2743027eb15975c7f  scripts/monthly-report-reflow.patch' | sha256sum --check
          git apply --check scripts/monthly-report-reflow.patch
          git apply --index scripts/monthly-report-reflow.patch
          git rm scripts/monthly-report-reflow.patch .github/workflows/monthly-report-offline-qa.yml .github/workflows/monthly-report-apply-reflow.yml
          cat <<'HASHES' | sha256sum --check
          3fc7505bf6012f99abbb9cadef04b63d6ca7e88b961ed9396c22fa7a107b3db6  app/monthly_report_import.py
          4323b8e6048b534f3badbfcced1f8885ae7a72b786f063a5a46ff04dfabc2c09  app/monthly_report_native_layout.py
          33b4acce790119bdfe93fe040c252c31c8b8e418746a864106fe7d84b0714d32  app/monthly_report_native_pages.py
          17757cff7d90f6a679297d8641f327704aeb0b939e68d90fb8888f386017a23b  tests/test_monthly_report_native_reflow.py
          aef55ea04f19de8e0c496eddc2cf08c228c56f21838650ce9c5fec0c4d2ede5c  docs/COMMIT_NOTES_2026-10-09_MONTHLY_REPORT_REWRITTEN_PAGES.md
          3d493f29bdcf6779f88ba86d8d3574ded32029c049335563863972df6af946bf  docs/README.md
          HASHES
          python -m compileall -q app pages scripts run_web.py
      - name: Run all tests after the fix
        run: python -m pytest -q --junitxml="$RUNNER_TEMP/reflow-after.xml"
      - name: Commit and fast-forward this remediation branch
        run: |
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reflow replaced monthly-report pages without empty source scaffolding'
          git push origin HEAD:fix/monthly-report-master-tables
          git rev-parse HEAD > "$RUNNER_TEMP/reflow-tested-sha.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reflow-verification
          path: |
            ${{ runner.temp }}/reflow-before.xml
            ${{ runner.temp }}/reflow-after.xml
            ${{ runner.temp }}/reflow-tested-sha.txt
          if-no-files-found: ignore
          retention-days: 7
