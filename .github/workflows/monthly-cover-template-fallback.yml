name: Monthly cover template fallback

on:
  pull_request:
    paths:
      - 'app/monthly_report_section_ui.py'
      - 'app/monthly_report_template_fallback.py'
      - 'scripts/qa_cover_template_fallback.py'
      - 'scripts/workspace_cover_template_fallback.py'
      - 'tests/test_cover_template_fallback_fixture.py'
      - 'tests/fixtures/workspaces/monthly_app.py'
      - '.github/workflows/monthly-cover-template-fallback.yml'
      - 'requirements*.lock'
  push:
    branches: [main]
    paths:
      - 'app/monthly_report_section_ui.py'
      - 'app/monthly_report_template_fallback.py'
      - 'scripts/qa_cover_template_fallback.py'
      - 'scripts/workspace_cover_template_fallback.py'
      - 'tests/test_cover_template_fallback_fixture.py'
      - 'tests/fixtures/workspaces/monthly_app.py'
      - '.github/workflows/monthly-cover-template-fallback.yml'
      - 'requirements*.lock'

permissions:
  contents: read

jobs:
  monthly-cover-template-fallback:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked app and native browser harness
        timeout-minutes: 20
        run: |
          sudo python3 scripts/ci_ubuntu_mirror_priority.py
          python -m pip install -r requirements-dev.lock playwright==1.58.0
          python scripts/patch_streamlit_frontend.py
          python scripts/patch_streamlit_date_input.py
          python -m playwright install --with-deps chromium webkit
      - name: Verify unchanged resource boundary and disposable fixture
        timeout-minutes: 3
        run: python -m pytest tests/test_cover_template_fallback_fixture.py -q
      - name: Real upload, edit, opt-in, save and generated DOCX in native browsers
        timeout-minutes: 6
        run: |
          python scripts/ci_native_test_budget.py --minutes 5 <<'NATIVE_TEST'
          python scripts/qa_cover_template_fallback.py
          NATIVE_TEST
      - name: Retain traces, receipts and synthetic DOCX
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: monthly-cover-template-fallback-${{ github.run_attempt }}
          path: test-artifacts/cover-template-fallback/
          retention-days: 7
          if-no-files-found: error
