name: Monthly first-paint diagnosis

on:
  push:
    branches: [repair/monthly-first-paint-20261026]

permissions:
  contents: read

jobs:
  first-paint-diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked app and native browser dependencies
        timeout-minutes: 20
        run: |
          sudo python3 scripts/ci_ubuntu_mirror_priority.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc
          python -m pip install -r requirements-dev.lock playwright==1.58.0
          python scripts/patch_streamlit_frontend.py
          python scripts/patch_streamlit_date_input.py
          python -m playwright install --with-deps chromium webkit
      - name: Record the first native reload press failure
        timeout-minutes: 16
        run: |
          python scripts/ci_native_test_budget.py --minutes 15 <<'NATIVE_TEST'
          python scripts/qa_monthly_period_first_paint.py
          NATIVE_TEST
      - name: Retain first failure and component geometry
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: monthly-first-paint-diagnosis-${{ github.run_attempt }}
          path: test-artifacts/monthly-period-first-paint/
          retention-days: 7
          if-no-files-found: error
