name: Audit MSAPO template branding

on:
  push:
    branches:
      - agent/workflow-correctness
    paths:
      - .github/workflows/template-audit.yml

permissions:
  contents: write

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, '[skip audit]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/workflow-correctness
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install python-docx
      - name: Inspect template text
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document

          doc = Document('templates/Master_MSAPO_Template.docx')
          lines = []
          lines.extend(p.text.strip() for p in doc.paragraphs if p.text.strip())
          for table in doc.tables:
              for row in table.rows:
                  text = ' | '.join(cell.text.strip() for cell in row.cells)
                  if text.strip(' |'):
                      lines.append(text)

          terms = (
              'rrh', 'rochester regional', 'rochester', 'regional health',
              'united memorial', 'st. mary', 'unity hospital', 'newark-wayne',
              'canton-potsdam', 'clifton springs', 'massena', 'gouverneur',
          )
          matches = []
          for line in lines:
              lowered = line.lower()
              if any(term in lowered for term in terms):
                  matches.append(line)

          report = [
              '# Template branding audit',
              '',
              f'- Total non-empty text lines: {len(lines)}',
              f'- Lines matching RRH/facility branding terms: {len(matches)}',
              '',
              '## Matches',
              '',
          ]
          report.extend(f'- `{line}`' for line in matches)
          if not matches:
              report.append('- No matching branding or facility text found.')
          Path('TEMPLATE_AUDIT.md').write_text('\n'.join(report) + '\n', encoding='utf-8')
          PY
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TEMPLATE_AUDIT.md
          git commit -m "Record template branding audit [skip audit]"
          git push origin HEAD:agent/workflow-correctness
