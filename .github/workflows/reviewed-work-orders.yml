name: Reviewed work-order browser

on:
  pull_request:
    paths:
      - 'app/monthly_report*.py'
      - 'scripts/qa_reviewed_work_orders.py'
      - 'tests/fixtures/workspaces/reviewed_work_orders_app.py'
      - 'scripts/patch_streamlit_frontend.py'
      - 'scripts/streamlit_*.py'
      - 'requirements*.lock'
      - '.github/workflows/reviewed-work-orders.yml'
  push:
    branches: [main]
    paths:
      - 'app/monthly_report*.py'
      - 'scripts/qa_reviewed_work_orders.py'
      - 'tests/fixtures/workspaces/reviewed_work_orders_app.py'
      - 'scripts/patch_streamlit_frontend.py'
      - 'scripts/streamlit_*.py'
      - 'requirements*.lock'
      - '.github/workflows/reviewed-work-orders.yml'

permissions:
  contents: read

jobs:
  reviewed-work-orders:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FONTCONFIG_FILE: ${{ github.workspace }}/runtime/fonts.conf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked native app, document renderer and both browsers
        timeout-minutes: 25
        run: |
          sudo python3 scripts/ci_ubuntu_mirror_priority.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc fonts-dejavu-core fonts-crosextra-carlito fonts-crosextra-caladea
          python -m pip install -r requirements-dev.lock playwright==1.58.0
          python scripts/patch_streamlit_frontend.py
          python scripts/patch_streamlit_date_input.py
          python -m playwright install --with-deps chromium webkit
      - name: Native upload, reviewed correction, saved reopen and actual Word/PDF
        timeout-minutes: 11
        run: |
          python scripts/ci_native_test_budget.py --minutes 10 <<'NATIVE_TEST'
          python scripts/qa_reviewed_work_orders.py
          NATIVE_TEST
      - name: Retain native evidence and first failures
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-work-orders-${{ github.run_attempt }}
          path: test-artifacts/reviewed-work-orders/
          retention-days: 7
          if-no-files-found: error
