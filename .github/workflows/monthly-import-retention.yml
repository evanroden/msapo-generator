name: Monthly import retention

on:
  pull_request:
    paths:
      - 'app/monthly_report_section_ui.py'
      - 'scripts/qa_import_receipts.py'
      - 'app/monthly_report_start_import.py'
      - 'app/monthly_report_source_sites_ui.py'
      - 'scripts/qa_import_retention.py'
      - 'scripts/workspace_import_retention.py'
      - 'tests/test_import_retention_fixture.py'
      - 'tests/fixtures/workspaces/monthly_app.py'
      - '.github/workflows/monthly-import-retention.yml'
      - 'requirements*.lock'
  push:
    branches: [main]
    paths:
      - 'app/monthly_report_section_ui.py'
      - 'scripts/qa_import_receipts.py'
      - 'app/monthly_report_start_import.py'
      - 'app/monthly_report_source_sites_ui.py'
      - 'scripts/qa_import_retention.py'
      - 'scripts/workspace_import_retention.py'
      - 'tests/test_import_retention_fixture.py'
      - 'tests/fixtures/workspaces/monthly_app.py'
      - '.github/workflows/monthly-import-retention.yml'
      - 'requirements*.lock'

permissions:
  contents: read

jobs:
  monthly-import-retention:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked app and native browser harness
        timeout-minutes: 20
        run: |
          sudo python3 scripts/ci_ubuntu_mirror_priority.py
          python -m pip install -r requirements-dev.lock playwright==1.58.0
          python scripts/patch_streamlit_frontend.py
          python scripts/patch_streamlit_date_input.py
          python -m playwright install --with-deps chromium webkit
      - name: Verify synthetic source classifications and isolated fixture
        timeout-minutes: 3
        run: python -m pytest tests/test_import_retention_fixture.py -q
      - name: Real upload, period/site corrections and durable reload in native browsers
        timeout-minutes: 8
        run: |
          python scripts/ci_native_test_budget.py --minutes 7 <<'NATIVE_TEST'
          python scripts/qa_import_retention.py
          NATIVE_TEST
      - name: Retain traces, receipts and synthetic DOCX
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: monthly-import-retention-${{ github.run_attempt }}
          path: test-artifacts/import-retention/
          retention-days: 7
          if-no-files-found: error
