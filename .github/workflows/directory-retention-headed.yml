name: Directory retention headed observation

on:
  pull_request:
    paths:
      - 'run_web.py'
      - 'app/web_ui.py'
      - 'app/device_identity.py'
      - 'app/memory.py'
      - 'app/monthly_report_directory*.py'
      - 'app/monthly_report_testing.py'
      - 'app/monthly_report_objects.py'
      - 'app/monthly_report_library.py'
      - 'app/monthly_report_ui.py'
      - 'app/monthly_report_admin_ui.py'
      - 'app/monthly_report_storage*.py'
      - 'scripts/qa_directory_retention_*.py'
      - 'tests/test_qa_directory_retention_*.py'
      - 'scripts/patch_streamlit_*.py'
      - 'requirements*.lock'
      - '.github/workflows/directory-retention-headed.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  directory-headed-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked app and native Chromium
        timeout-minutes: 18
        run: |
          python -m pip install -r requirements-dev.lock playwright==1.58.0
          python scripts/patch_streamlit_frontend.py
          python scripts/patch_streamlit_date_input.py
          python -m playwright install --with-deps chromium
      - name: Install read-only X11 observation utilities
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth x11-utils
      - name: Observe native CSV dialog without confirmation
        timeout-minutes: 10
        run: |
          python scripts/ci_native_test_budget.py --minutes 9 <<'NATIVE_TEST'
          python -m pytest -q tests/test_qa_directory_retention_live.py tests/test_qa_directory_retention_local.py tests/test_qa_directory_retention_headed.py
          python scripts/qa_directory_retention_headed.py
          NATIVE_TEST
      - name: Preserve synthetic first-attempt evidence
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: directory-retention-headed-observation-${{ github.run_attempt }}
          path: test-artifacts/directory-retention-headed-observation/
          retention-days: 7
          if-no-files-found: error
