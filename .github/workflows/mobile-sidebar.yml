name: Mobile sidebar hit testing

on:
  pull_request:
    paths:
      - '.github/workflows/mobile-sidebar.yml'
      - 'scripts/qa_mobile_sidebar.py'
      - 'app/web_ui.py'
      - 'app/monthly_report_guided.py'
      - 'app/monthly_report_admin_ui.py'
      - 'pages/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mobile-sidebar.yml'
      - 'scripts/qa_mobile_sidebar.py'
      - 'app/web_ui.py'
      - 'app/monthly_report_guided.py'
      - 'app/monthly_report_admin_ui.py'
      - 'pages/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mobile-sidebar:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked application and touch browser runtimes
        timeout-minutes: 25
        run: |
          sudo python3 scripts/ci_ubuntu_mirror_priority.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc
          python -m pip install -r requirements-dev.lock
          python scripts/patch_streamlit_frontend.py
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
      - name: Regression tests for sidebar, directory, and application
        timeout-minutes: 12
        run: |
          python -m pytest -q tests/test_sidebar_navigation.py tests/test_monthly_report_directory_sidebar.py tests/test_web_ui_app.py
      - name: Real synthetic Monthly, purchase-order and expense touch hit tests
        timeout-minutes: 27
        run: |
          python scripts/ci_native_test_budget.py --minutes 26 <<'NATIVE_TEST'
          python scripts/qa_mobile_sidebar.py
          NATIVE_TEST
      - name: Upload first-failure geometry and screenshots
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: mobile-sidebar-chromium-webkit
          path: test-artifacts/mobile-sidebar/
          if-no-files-found: warn
          retention-days: 7
