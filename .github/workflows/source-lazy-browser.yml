name: Monthly source forms mount lazily (A30)

# A dedicated workflow: the Adaptive workspace jobs, their steps and their
# aggregate native budgets are byte-pinned by tests/test_ci_native_test_budget.py
# and tests/test_water_row_workflow_partition.py.
on:
  pull_request:
    paths:
      - 'app/monthly_report_source*'
      - 'app/monthly_report_upload_ui.py'
      - 'app/monthly_report_guided.py'
      - 'scripts/qa_monthly_source_lazy_browser.py'
      - 'tests/fixtures/workspaces/monthly_source_lazy_app.py'
      - 'requirements*.lock'
      - '.github/workflows/source-lazy-browser.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-lazy-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked app and browser harness
        timeout-minutes: 20
        run: |
          sudo python3 scripts/ci_ubuntu_mirror_priority.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc
          python -m pip install -r requirements-dev.lock
          python scripts/patch_streamlit_frontend.py
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
      - name: Apply exact locked scalar date compatibility repair
        timeout-minutes: 16
        run: |
          python scripts/ci_native_test_budget.py --minutes 15 <<'NATIVE_TEST'
          python scripts/patch_streamlit_date_input.py
          NATIVE_TEST
      - name: A30 native 50-source unsent edits, switch/save, close/reopen and narrow viewport
        if: ${{ !cancelled() }}
        timeout-minutes: 16
        run: |
          python scripts/ci_native_test_budget.py --minutes 15 <<'NATIVE_TEST'
          python scripts/qa_monthly_source_lazy_browser.py
          NATIVE_TEST
      - name: Retain A30 source browser evidence
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: a30-source-lazy-browser-${{ github.run_attempt }}
          path: test-artifacts/a30-source-lazy-browser/
          retention-days: 7
          if-no-files-found: warn
