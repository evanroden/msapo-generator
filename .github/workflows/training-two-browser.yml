name: Monthly two-browser Training preservation

on:
  pull_request:
    paths:
      - 'scripts/qa_training_two_browser.py'
      - '.github/workflows/training-two-browser.yml'
      - 'app/monthly_report_training*'
      - 'app/monthly_report_guided.py'
      - 'app/monthly_report_library.py'
      - 'app/monthly_report_active_conflict_ui.py'

permissions:
  contents: read

concurrency:
  group: training-two-browser-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  native-training-conflict:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FONTCONFIG_FILE: ${{ github.workspace }}/runtime/fonts.conf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked app, real converter and native browser
        timeout-minutes: 18
        run: |
          sudo python3 scripts/ci_ubuntu_mirror_priority.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc fonts-dejavu-core fonts-crosextra-carlito fonts-crosextra-caladea
          python -m pip install -r requirements-dev.lock playwright==1.58.0
          python scripts/patch_streamlit_frontend.py
          python scripts/patch_streamlit_date_input.py
          python -m playwright install --with-deps chromium
      - name: Two genuinely distinct browser contexts against one versioned synthetic Training store
        timeout-minutes: 13
        run: python -m scripts.qa_training_two_browser
      - name: Preserve first-failure DOM and actual synthetic output evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-two-browser-${{ github.run_attempt }}
          path: test-artifacts/training-two-browser/
          retention-days: 7
          if-no-files-found: warn
