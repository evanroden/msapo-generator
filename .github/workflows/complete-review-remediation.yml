name: Complete review remediation publish

on:
  push:
    branches:
      - fix/review-findings-2026-08-17
    paths:
      - .github/workflows/complete-review-remediation.yml

permissions:
  contents: write

jobs:
  publish-tested-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish the verified tree
        env:
          BASE_SHA: c7d054a2f2654accffebb2ef8a6c12b632a45bdd
          EXPECTED_TREE: adfab3be99728bf7a8fb9f2634431d1b9880d589
          TARGET_BRANCH: fix/review-findings-2026-08-17
        shell: bash
        run: |
          set -euo pipefail
          cat .github/review-publish/chunk-*.b64 \
            | base64 --decode \
            | gzip --decompress \
            > "$RUNNER_TEMP/review-remediation.patch"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --detach "$BASE_SHA"
          git apply --index --whitespace=error "$RUNNER_TEMP/review-remediation.patch"

          final_tree="$(git write-tree)"
          test "$final_tree" = "$EXPECTED_TREE"

          final_commit="$(
            {
              printf '%s\n\n' 'Fix reviewed routing, OCR, and expense defects'
              printf '%s\n\n' 'Resolve every requested two-week review finding except the explicitly deferred public authentication and rate-limiting item.'
              printf '%s\n\n' 'Preserve unresolved routing choices; harden facility, asset, equipment, parts, labor, and pump inference; and pass reviewed vendor/facility values into the MSAPO.'
              printf '%s\n\n' 'Bound all image/PDF vision paths. Migrate approver identity to name plus email, disambiguate duplicate names, preserve seeded email selection, and match Excel mileage rounding.'
              printf '%s\n\n' 'Refresh live Needs You placement and Smartsheet warning order. Add exact production/dev locks for Docker and CI.'
              printf '%s\n' 'Validated: 444 passed, 3 expected skips; compileall, pip check, lock consistency, and diff checks passed. Detailed engineering notes are included in docs/.'
            } | git commit-tree "$final_tree" -p "$GITHUB_SHA"
          )"

          git push origin "$final_commit:refs/heads/$TARGET_BRANCH"
