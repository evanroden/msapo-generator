name: Monthly preview latency evidence

on:
  pull_request:
    paths:
      - 'scripts/qa_monthly_preview_latency_e2e.py'
      - 'scripts/qa_monthly_preview_browser_latency.py'
      - 'tests/test_monthly_preview_latency_lifecycle.py'
      - 'docs/MONTHLY_PREVIEW_LATENCY_E2E.md'
      - '.github/workflows/monthly-preview-latency.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/qa_monthly_preview_latency_e2e.py'
      - 'scripts/qa_monthly_preview_browser_latency.py'
      - '.github/workflows/monthly-preview-latency.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  capped-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build exactly this code in the production runtime
        run: docker build --build-arg APP_GIT_COMMIT="${{ github.event.pull_request.head.sha || github.sha }}" -t msapo-491-latency .
      - name: Collect cold/warm and uncached/reused synthetic timing samples
        timeout-minutes: 22
        run: |
          for part in sources native; do
            docker run --name "msapo-491-latency-$part" --memory=512m --memory-swap=512m --cpus=0.5 \
              --env RESOURCE_REQUIRE_512_MB=1 \
              --env RESOURCE_REQUIRE_HALF_CPU=1 \
              --env ANTHROPIC_API_KEY=test-key-not-used \
              --entrypoint python msapo-491-latency scripts/qa_monthly_preview_latency_e2e.py --part "$part"
            test "$(docker inspect --format='{{.State.OOMKilled}}' "msapo-491-latency-$part")" = false
          done
      - name: Copy collected measurements even when a later check fails
        if: always()
        run: |
          mkdir -p test-artifacts/monthly-preview-latency
          for part in sources native; do
            docker cp "msapo-491-latency-$part:/tmp/monthly-preview-latency/." test-artifacts/monthly-preview-latency/ || true
            docker logs "msapo-491-latency-$part" > "test-artifacts/monthly-preview-latency/$part-container.log" 2>&1 || true
            docker inspect "msapo-491-latency-$part" > "test-artifacts/monthly-preview-latency/$part-inspect.json" || true
          done
      - name: Upload timing and OOM diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-preview-latency-capped-${{ github.run_attempt }}
          path: test-artifacts/monthly-preview-latency/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove disposable benchmark container
        if: always()
        run: docker rm --force msapo-491-latency-sources msapo-491-latency-native || true

  native-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install pinned app and real browser/renderer dependencies
        timeout-minutes: 20
        run: |
          sudo python3 scripts/ci_ubuntu_mirror_priority.py
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc fontconfig fonts-dejavu-core fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea fonts-texgyre fonts-opensymbol
          python -m pip install -r requirements-dev.lock playwright==1.58.0
          python scripts/patch_streamlit_frontend.py
          python scripts/patch_streamlit_date_input.py
          python -m playwright install --with-deps chromium webkit
      - name: Focused owner/revision, store and stale-worker correctness
        timeout-minutes: 6
        run: |
          python -m pytest -q             tests/test_monthly_preview_latency_lifecycle.py             tests/test_monthly_report_preview_resources.py             tests/test_monthly_report_preview_store.py             tests/test_monthly_report_section_assembly_cache.py
      - name: Measure actual source upload/gallery and real section first decoded image
        timeout-minutes: 12
        env:
          MSAPO_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/qa_monthly_preview_browser_latency.py
      - name: Preserve uncapped browser reference distribution
        run: cp test-artifacts/monthly-preview-latency/browser.json test-artifacts/monthly-preview-latency/browser-uncapped.json
      - name: Build production image for capped real-UI server
        timeout-minutes: 10
        run: docker build --build-arg APP_GIT_COMMIT="${{ github.event.pull_request.head.sha || github.sha }}" -t msapo-491-browser .
      - name: Measure real browser against production image at 512MiB and 0.5 CPU
        timeout-minutes: 12
        env:
          MSAPO_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          qa_root="$(mktemp -d -t qa491-capped-XXXXXXXX)"
          printf 'synthetic-monthly-dom-v1' > "$qa_root/monthly-dom-synthetic-only.marker"
          mkdir -p test-artifacts/monthly-preview-latency
          cleanup() {
            docker logs msapo-491-browser > test-artifacts/monthly-preview-latency/capped-streamlit.log 2>&1 || true
            docker inspect msapo-491-browser > test-artifacts/monthly-preview-latency/capped-container.json || true
            docker exec msapo-491-browser sh -c 'cat /sys/fs/cgroup/memory.peak; cat /sys/fs/cgroup/memory.events; cat /sys/fs/cgroup/cpu.stat' > test-artifacts/monthly-preview-latency/capped-resource-stats.txt 2>&1 || true
            docker rm -f msapo-491-browser || true
            rm -rf "$qa_root" 2>/dev/null || true
          }
          trap cleanup EXIT
          docker run -d --name msapo-491-browser --memory=512m --memory-swap=512m --cpus=0.5 \
            --env EPC_DATA_DIR=/tmp/qa491 --env EPC_MONTHLY_DOM_FIXTURE=1 \
            --env SMARTSHEET_API_MODE=disabled --env ANTHROPIC_API_KEY='' \
            -v "$qa_root:/tmp/qa491" -v "$GITHUB_WORKSPACE/tests:/app/tests:ro" \
            -p 127.0.0.1:8534:8501 --entrypoint python msapo-491-browser \
            -m streamlit run tests/fixtures/workspaces/monthly_app.py \
            --server.address 0.0.0.0 --server.port 8501 --server.headless true --browser.gatherUsageStats false
          healthy=0
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8534/_stcore/health >/dev/null; then healthy=1; break; fi
            sleep 0.5
          done
          test "$healthy" = 1
          QA491_EXTERNAL_SERVER=1 python scripts/qa_monthly_preview_browser_latency.py
          cp test-artifacts/monthly-preview-latency/browser.json test-artifacts/monthly-preview-latency/browser-capped.json
          test "$(docker inspect --format='{{.State.OOMKilled}}' msapo-491-browser)" = false
      - name: Retain timing, Streamlit logs and first-failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-preview-latency-browser-${{ github.run_attempt }}
          path: test-artifacts/monthly-preview-latency/
          if-no-files-found: warn
          retention-days: 14
