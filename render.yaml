services:
  - type: web
    name: msapo-generator
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PDF_BACKEND
        value: libreoffice
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      # Persistent disk (created in the Render dashboard, mounted at /test1)
      # where the per-contract learning database lives.
      - key: EPC_DATA_DIR
        value: /test1
      # Smartsheet PO-sheet integration — OFF until BOTH are set in the
      # dashboard. Leave unset and the app never shows the Smartsheet button.
      #   SMARTSHEET_API_TOKEN: a Smartsheet API token (use a service account)
      #   SMARTSHEET_SHEET_ID:  numeric ID of the destination PO sheet
      - key: SMARTSHEET_API_TOKEN
        sync: false
      - key: SMARTSHEET_SHEET_ID
        sync: false
      # Fallback for when we get no API credentials and can't enable URL
      # pre-fill on the form: set just this to the PO form's URL and the app
      # shows a fast copy-each-field panel for filling it in by hand.
      # Independent of the two vars above — neither is required.
      - key: SMARTSHEET_FORM_URL
        sync: false
