services:
  - type: web
    name: msapo-generator
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: EPC_AI_PROVIDER
        value: anthropic
      - key: EPC_AI_MODEL
        value: claude-sonnet-4-6
      - key: EPC_PDF_READER
        value: pymupdf
      - key: EPC_PDF_CONVERTER
        value: libreoffice
      # Persistent disk is created in the Render dashboard and mounted at /test1.
      - key: EPC_DATA_DIR
        value: /test1
      # Generated files are ephemeral and should not consume the persistent disk.
      - key: EPC_WORK_DIR
        value: /tmp/email-process-control
      - key: EPC_OUTPUT_DIR
        value: /tmp/email-process-control/output
      - key: EPC_MEMORY_BACKEND
        value: sqlite
      - key: EPC_SUBMISSION_STORE_BACKEND
        value: sqlite
      # Future Smartsheet routes remain inert until verified configuration exists.
      - key: SMARTSHEET_URL_PREFILL_ENABLED
        value: "false"
      - key: SMARTSHEET_PREFILL_MAX_URL_LENGTH
        value: "7000"
      - key: SMARTSHEET_API_MODE
        value: disabled
      - key: SMARTSHEET_ALLOW_CUSTOM_API_BASE
        value: "false"
      - key: SMARTSHEET_FORM_URL
        sync: false
      - key: SMARTSHEET_API_TOKEN
        sync: false
      - key: SMARTSHEET_SHEET_ID
        sync: false
