services:
  - type: web
    name: msapo-generator
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PDF_BACKEND
        value: libreoffice
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      # Persistent disk is created in the Render dashboard and mounted at /test1.
      # It stores contract learning, anonymous browser requester learning, and
      # fail-closed Smartsheet idempotency state.
      - key: EPC_DATA_DIR
        value: /test1
      # The verified PO form enables the manual handoff only. URL-prefill and API
      # submission remain independently disabled until their acceptance gates pass.
      - key: SMARTSHEET_FORM_URL
        value: https://app.smartsheet.com/b/form/019e8e6717c471628f9a02280a892100
      - key: SMARTSHEET_URL_PREFILL_ENABLED
        value: "false"
      - key: SMARTSHEET_PREFILL_MAX_URL_LENGTH
        value: "7000"
      - key: SMARTSHEET_API_MODE
        value: disabled
      - key: SMARTSHEET_ALLOW_CUSTOM_API_BASE
        value: "false"
      - key: SMARTSHEET_API_TOKEN
        sync: false
      - key: SMARTSHEET_SHEET_ID
        sync: false
