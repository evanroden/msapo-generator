[server]
headless = true
port = 8501
address = "0.0.0.0"
# XSRF protection requires same-origin CORS enforcement. Keep both controls
# aligned instead of relying on Streamlit to override a contradictory value.
enableCORS = true
enableXsrfProtection = true
# Shared reference templates may be larger than documents the report importer
# can parse. Each importer retains its own smaller, independently checked cap.
maxUploadSize = 512

[browser]
gatherUsageStats = false

[client]
# The root workflow selector owns navigation. Keep the old pages/ bookmark
# notice reachable by URL without promoting it as a second working tool.
showSidebarNavigation = false

[theme]
font = "sans serif"

[theme.light]
primaryColor = "#D6EF4B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#D3E7E0"
textColor = "#092B24"

[theme.dark]
primaryColor = "#D6EF4B"
backgroundColor = "#111E1A"
secondaryBackgroundColor = "#20342C"
textColor = "#EDF5F0"
borderColor = "#77938A"
