[server]
headless = true
port = 8501
address = "0.0.0.0"
# XSRF protection requires same-origin CORS enforcement. Keep both controls
# aligned instead of relying on Streamlit to override a contradictory value.
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 200

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#D6EF4B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#D3E7E0"
textColor = "#092B24"
font = "sans serif"
