[server]
headless = true
port = 8501
address = "0.0.0.0"
# XSRF protection requires same-origin CORS enforcement. Keep both controls
# aligned instead of relying on Streamlit to override a contradictory value.
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 200

[browser]
gatherUsageStats = false

[runner]
# Keep each session's source validation and its next widget rerun on one
# runner. Immediate replacement runners can contend with their own unfinished
# validation and incorrectly make ordinary edits require a capacity Retry.
# Other sessions still use the unchanged shared admission/resource checks.
fastReruns = false

[client]
# The root workflow selector owns navigation. Keep the old pages/ bookmark
# notice reachable by URL without promoting it as a second working tool.
showSidebarNavigation = false

[theme]
primaryColor = "#D6EF4B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#D3E7E0"
textColor = "#092B24"
font = "sans serif"
