[server]
headless = true
port = 8501
address = "0.0.0.0"
# XSRF protection requires same-origin CORS enforcement. Keep both controls
# aligned instead of relying on Streamlit to override a contradictory value.
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 200

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#E8792F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F9FC"
textColor = "#1E293B"
font = "sans serif"
