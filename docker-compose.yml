services:
  web:
    build:
      context: .
    # Use the locked, renderer-verified production Dockerfile unchanged.
    ports:
      - "${PORT:-8501}:8501"
    env_file: .env
    environment:
      PORT: "8501"
      EPC_DATA_DIR: /var/lib/epc
      EPC_WORK_DIR: /var/tmp/epc
    volumes:
      - epc-data:/var/lib/epc
      - epc-work:/var/tmp/epc
      - ./templates:/app/templates:ro
    command: python -m app.entrypoint

  gotenberg:
    image: gotenberg/gotenberg:8
    profiles: ["gotenberg"]
    ports:
      - "3000:3000"

volumes:
  epc-data:
  epc-work:
