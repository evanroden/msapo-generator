<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Keep system font directories, caches and fallback rules. Apply these
       template substitutions last, independently of the host's extra fonts. -->
  <include>/etc/fonts/fonts.conf</include>
  <dir>/usr/share/texmf/fonts</dir>
  <match target="pattern">
    <test name="family" compare="eq"><string>Arial</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Arial Narrow</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>TeX Gyre Heros Cn</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Times New Roman</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Symbol</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>OpenSymbol</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Calibri</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Cambria</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Caladea</string></edit>
  </match>
</fontconfig>
