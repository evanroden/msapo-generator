<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body {
      background: transparent;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
    }
    #share-email {
      -webkit-tap-highlight-color: transparent;
      background: #D6EF4B;
      border: 2px solid #092B24;
      border-radius: 4px;
      color: #092B24;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      min-height: 48px;
      padding: 0.7rem 1rem;
      touch-action: manipulation;
      width: 100%;
    }
    #share-email:disabled { cursor: not-allowed; opacity: 0.58; }
    #share-status {
      color: #31554D;
      font-size: 13px;
      line-height: 1.35;
      margin: 8px 2px 0;
      /* An email address has no natural break points; without this a Cc line
         runs past the right edge of an iPhone-width frame. */
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <button id="share-email" type="button" disabled>
    Open approval email in Mail — PDF attached
  </button>
  <p id="share-status" role="status">Preparing the attached PDF…</p>

  <script>
    const button = document.getElementById("share-email");
    const status = document.getElementById("share-status");
    let current = null;

    let parentOrigin = "*";
    try {
      const streamlitUrl = new URLSearchParams(location.search).get("streamlitUrl");
      if (streamlitUrl) parentOrigin = new URL(streamlitUrl).origin;
    } catch (error) {
      parentOrigin = "*";
    }

    const sendToStreamlit = (type, extra = {}) => window.parent.postMessage(
      {isStreamlitMessage: true, type, ...extra},
      parentOrigin
    );

    // Measured, not fixed. A Cc instruction makes the status line three or four
    // lines on a phone, and a fixed 112px iframe clips the bottom of it with no
    // error: the employee would see half an instruction. 112 stays the floor.
    const fitFrame = () => sendToStreamlit("streamlit:setFrameHeight", {
      height: Math.max(112, Math.ceil(document.body.scrollHeight) + 4),
    });

    // textContent only, never innerHTML: the addresses come from deployment
    // configuration and from a field the operator typed.
    const setStatus = (text) => {
      status.textContent = text;
      fitFrame();
    };

    const decode = (value, mime) => {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return new Blob([bytes], {type: mime});
    };

    const browserFiles = (sourceFiles) => sourceFiles.map((file) => new File(
      [decode(file.b64, file.mime)],
      file.name,
      {type: file.mime}
    ));

    const directShareIsAvailable = (files) => {
      try {
        return files.length > 0 && Boolean(
          navigator.canShare && navigator.canShare({files})
        );
      } catch (error) {
        return false;
      }
    };

    const render = (args) => {
      try {
        const files = browserFiles(Array.isArray(args.files) ? args.files : []);
        current = {
          to: String(args.to || ""),
          cc: String(args.cc || ""),
          subject: String(args.subject || ""),
          body: String(args.body || ""),
          files,
        };
        if (directShareIsAvailable(files)) {
          button.disabled = false;
          setStatus(
            "The approver email will be copied; choose Mail or Outlook in the share sheet." +
            (current.cc ? ` Then add ${current.cc} to Cc.` : "")
          );
        } else {
          button.disabled = true;
          setStatus("This browser cannot share the PDF directly. Choose an Outlook option above, or use the files under Other file and email options.");
        }
      } catch (error) {
        current = null;
        button.disabled = true;
        setStatus("The PDF could not be prepared for sharing. Choose an Outlook option above, or use Other file and email options.");
      }
    };

    window.addEventListener("message", (event) => {
      if (parentOrigin !== "*" && event.origin !== parentOrigin) return;
      if (event.source !== window.parent) return;
      if (event.data?.type === "streamlit:render") render(event.data.args || {});
    });

    button.addEventListener("click", async () => {
      if (!current || button.disabled) return;

      const copyField = document.createElement("textarea");
      copyField.value = current.to;
      copyField.setAttribute("readonly", "");
      copyField.style.position = "fixed";
      copyField.style.opacity = "0";
      document.body.appendChild(copyField);
      copyField.focus();
      copyField.select();
      copyField.setSelectionRange(0, copyField.value.length);
      let copied = false;
      try { copied = document.execCommand("copy"); } catch (error) {}
      copyField.remove();

      // Only the approver fits on the clipboard -- it holds one string -- so the
      // Cc is spelled out for the employee to add in the mail app.
      const ccStep = current.cc ? ` Add ${current.cc} to Cc.` : "";
      setStatus(copied
        ? `Approver email copied. Choose Mail or Outlook, then paste it into To.${ccStep}`
        : `Choose Mail or Outlook, then address the message to ${current.to}.${ccStep}`);

      try {
        await navigator.share({
          files: current.files,
          title: current.subject,
          text: current.body,
        });
      } catch (error) {
        if (error.name !== "AbortError") {
          setStatus("The share sheet could not open. Choose an Outlook option above, or use Other file and email options.");
        }
      }
    });

    sendToStreamlit("streamlit:componentReady", {apiVersion: 1});
  </script>
</body>
</html>
